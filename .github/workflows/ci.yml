name: ci

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit + integration tests
        run: python -m unittest discover -s tests -v

  version-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: VERSION must increase over main
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          new=$(tr -d '[:space:]' < VERSION)
          old=$(git show "$BASE_SHA:VERSION" 2>/dev/null | tr -d '[:space:]' || true)
          [ -n "$old" ] || old=0.0.0
          echo "base=$old  pr=$new"
          echo "$new" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "::error::VERSION '$new' is not MAJOR.MINOR.PATCH"; exit 1; }
          python3 -c '
          import sys
          def t(v):
              return tuple(int(p) for p in v.split("."))
          old, new = t(sys.argv[1]), t(sys.argv[2])
          if new <= old:
              print("::error::VERSION must increase over main (%s -> %s)" % (sys.argv[1], sys.argv[2]))
              sys.exit(1)
          kind = next(l for l, a, b in zip(("major", "minor", "patch"), old, new) if a != b)
          print("VERSION bump: %s (%s -> %s)" % (kind, sys.argv[1], sys.argv[2]))
          ' "$old" "$new"

  build:
    uses: ./.github/workflows/build.yml

  # Plain job in the caller workflow: its check name has no "<caller>/<job>"
  # prefix (unlike the reusable workflow's jobs), so branch protection can
  # require one stable check that only passes when tests, the version bump and
  # both builds all succeed.
  gate:
    needs: [test, version-check, build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify all required jobs succeeded
        run: |
          echo "test=${{ needs.test.result }}  version-check=${{ needs.version-check.result }}  build=${{ needs.build.result }}"
          for r in "${{ needs.test.result }}" "${{ needs.version-check.result }}" "${{ needs.build.result }}"; do
            [ "$r" = "success" ] || { echo "::error::a required job did not pass"; exit 1; }
          done
