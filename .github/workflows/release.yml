name: release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
      release: ${{ steps.read.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: read
        name: Read VERSION, decide whether to release
        run: |
          set -euo pipefail
          version=$(tr -d '[:space:]' < VERSION)
          echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "::error::VERSION '$version' is not MAJOR.MINOR.PATCH"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git ls-remote --tags --refs origin "refs/tags/v$version" | grep -q .; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "tag v$version already exists - nothing to release"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "will release v$version"
          fi

  build:
    needs: prepare
    if: needs.prepare.outputs.release == 'true'
    uses: ./.github/workflows/build.yml

  release:
    needs: [prepare, build]
    if: needs.prepare.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          name: v${{ needs.prepare.outputs.version }}
          generate_release_notes: true
          files: dist/*

  # Housekeeping: keep only the newest KEEP releases (old assets add up ~32 MB
  # each). The git tags are left alone, so version history and rollback links
  # survive - only the release + its assets go.
  prune:
    needs: [prepare, release]
    if: needs.prepare.outputs.release == 'true'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      KEEP: "10"
    steps:
      - name: Delete all but the newest releases
        run: |
          set -euo pipefail
          mapfile -t tags < <(gh release list --limit 200 \
            --json tagName,createdAt --jq 'sort_by(.createdAt) | reverse | .[].tagName')
          echo "keeping the newest $KEEP of ${#tags[@]} release(s)"
          for tag in "${tags[@]:$KEEP}"; do
            echo "pruning $tag"
            gh release delete "$tag" --yes
          done
